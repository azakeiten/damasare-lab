<main id="app">
  <section class="view" id="v-home" aria-label="ホーム"></section>
  <section class="view" id="v-play" aria-label="ストーリー" hidden>
    <div class="playbar bleed b-genre">
      <a class="back" href="#home" id="playBack">← シナリオ一覧</a>
      <div class="pt"><span class="gtag" id="playTag"></span><b id="playTitle"></b></div>
      <div class="meter" id="meter" aria-label="いまのあぶなさ"></div>
      <div class="pdots" id="playDots" aria-label="見つけたサイン"></div>
    </div>
    <div class="playgrid">
      <div class="phone-col">
        <div class="phone">
          <div class="screen" id="screen" data-scene="dm">
            <div class="status"><span id="clock">23:12</span><span class="island"></span><span class="icons"><i></i><i></i><i></i><span class="batt"><b></b></span></span></div>
            <div class="head" id="head"></div>
            <div class="log" id="log" aria-live="polite"></div>
            <div class="composer" id="composer"></div>
            <div class="overlay" id="overlay" hidden><div class="stop" id="stop" role="dialog" aria-modal="true" aria-labelledby="stopTitle"></div></div>
          </div>
        </div>
      </div>
      <aside class="pside" aria-label="このシナリオの記録">
        <div class="card-plain">
          <div class="side-h"><h2>会話のテンポ</h2></div>
          <div class="seg" role="group" aria-label="会話のテンポ">
            <button type="button" id="tempo-normal" data-t="normal">ふつう</button>
            <button type="button" id="tempo-fast" data-t="fast">はやい</button>
            <button type="button" id="tempo-instant" data-t="instant">一瞬</button>
          </div>
        </div>
        <div>
          <div class="side-h"><h2>このシナリオのサイン</h2><span id="zcount"></span></div>
          <ul class="signs" id="signs"></ul>
        </div>
        <div>
          <div class="side-h"><h2>ストーリーマップ</h2><span>分かれ道の全体図</span></div>
          <div class="card-plain mapbox" id="mapBox"></div>
        </div>
        <div>
          <div class="side-h"><h2>エンディング</h2><span id="ecount"></span></div>
          <div class="ends" id="ends"></div>
        </div>
      </aside>
    </div>
  </section>
  <section class="view" id="v-zukan" aria-label="サイン図鑑" hidden></section>
  <section class="view" id="v-teach" aria-label="授業で使う" hidden></section>
  <section class="view" id="v-help" aria-label="相談先" hidden></section>
